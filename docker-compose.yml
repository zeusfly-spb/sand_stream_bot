services:
  db:
    image: postgres:16-alpine
    container_name: sandstreambot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandstream
      POSTGRES_USER: sandstream
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
